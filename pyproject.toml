[project]
name = "yo-snoop"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "google-cloud-texttospeech>=2.20",
  "aiohttp>=3.10",
  "websockets>=13",
  "claude-agent-sdk==0.2.163",
  "mcp>=2.3.0",
]

[project.optional-dependencies]
desk = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yosnoop"]

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]
markers = ["slow: needs the Whisper model"]
